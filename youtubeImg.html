<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歌詞画像ジェネレーター</title>
<style>
  :root {
    --bg: #eee;
    --panel: #fff;
    --border: #ccc;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 15px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: #222;
  }
  .app {
    display: flex;
    gap: 16px;
    padding: 16px;
    align-items: flex-start;
    min-height: 100vh;
  }
  .preview {
    flex: 1 1 auto;
    min-width: 0;
    position: sticky;
    top: 16px;
  }
  /* 透過部分が分かるように市松模様を敷く */
  .canvas-wrap {
    background:
      conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0 / 20px 20px;
    border: 1px solid var(--border);
    line-height: 0;
  }
  canvas { width: 100%; height: auto; display: block; }
  [hidden] { display: none !important; }
  #status { margin-top: 8px; min-height: 1.5em; font-size: 13px; color: #b91c1c; }

  form {
    flex: 0 0 420px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: grid;
    gap: 8px;
  }
  fieldset { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px 10px; display: grid; gap: 6px; }
  legend { padding: 0 6px; font-weight: 600; font-size: 13px; color: #555; }
  label { display: grid; grid-template-columns: 8.5em 1fr; align-items: center; gap: 8px; font-size: 14px; }
  label.inline { display: flex; gap: 6px; }
  label.stack { grid-template-columns: 1fr; }
  input[type="text"], select, textarea { width: 100%; font: inherit; padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; }
  textarea { resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  output { font-size: 12px; color: #666; min-width: 2.5em; text-align: right; }
  .range { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; }

  @media (max-width: 1000px) {
    .app { flex-direction: column; }
    .preview { position: static; width: 100%; }
    form { flex-basis: auto; width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="preview">
    <div class="canvas-wrap"><canvas id="canvas1" width="1280" height="720"></canvas></div>
    <div id="status" role="status"></div>
  </div>

  <form name="form1" autocomplete="off">
    <fieldset>
      <legend>共通</legend>
      <label>状態
        <select name="type">
          <option value="title">タイトル</option>
          <option value="main4" selected>メイン</option>
          <option value="bg">背景のみ</option>
        </select></label>
      <label>背景色<input type="text" name="bgColor" value="transparent"></label>
      <label>背景画像URL<input type="text" name="flg" value="" placeholder="空欄なら背景画像なし"></label>
      <label class="inline"><input type="checkbox" name="zoom" value="zoom" checked>背景を拡大(画面いっぱいに表示)</label>
      <label>文字色(暗幕は反対色)
        <select name="color">
          <option value="black">black</option>
          <option value="white" selected>white</option>
          <option value="yellow">yellow</option>
        </select></label>
      <label>暗幕の濃さ(alpha)
        <select name="alpha">
          <option value="0">0</option>
          <option value="0.25">0.25</option>
          <option value="0.5">0.5</option>
        </select></label>
    </fieldset>

    <fieldset data-modes="title">
      <legend>タイトル</legend>
      <label>国旗URL<input type="text" name="kokki" value="" placeholder="空欄なら国旗なし"></label>
      <label>タイトル<input type="text" name="title" value=""></label>
      <label>タイトルの大きさ
        <span class="range"><input type="range" name="titleSize" min="40" max="320" step="5" value="160"><output></output></span></label>
      <label>タイトルのy座標
        <span class="range"><input type="range" name="titleY" min="0" max="720" step="5" value="160"><output></output></span></label>
      <label>日本語タイトル<input type="text" name="titleJa" value=""></label>
    </fieldset>

    <fieldset data-modes="main4">
      <legend>歌詞</legend>
      <label class="stack">歌詞(4行で1画面。ルビは「(漢字|かな)」形式)
        <textarea name="lyr" rows="4"></textarea></label>
      <label class="stack">歌詞(2段目・原語など)
        <textarea name="lyr2" rows="4"></textarea></label>
      <label class="stack">和訳
        <textarea name="lyrJa" rows="4"></textarea></label>
    </fieldset>

    <fieldset data-modes="title main4">
      <legend>文字</legend>
      <label>フォント<select name="font"></select></label>
      <label>太さ
        <span class="range"><input type="range" name="isBold" min="100" max="900" step="100" value="400"><output></output></span></label>
      <label>イタリック
        <select name="italic">
          <option value="italic">yes</option>
          <option value="" selected>no</option>
        </select></label>
    </fieldset>

    <fieldset data-modes="main4">
      <legend>メイン用</legend>
      <label>フォント2(2段目)
        <select name="font2">
          <option value="bold 35px BIZ UDPゴシック" selected>BIZ UDPゴシック</option>
          <option value="35px Noto Sans">Noto Sans</option>
          <option value="40px SimHei">SimHei</option>
          <option value="40px Times New Roman">Times New Roman</option>
        </select></label>
      <label>配置(LR)
        <select name="LR">
          <option value="right">right (右から左)</option>
          <option value="left" selected>left</option>
          <option value="under">under (ルビ下詰め)</option>
        </select></label>
      <label>リガチャ
        <select name="ligature">
          <option value="true">true</option>
          <option value="false">false</option>
        </select></label>
      <label>フォントサイズ
        <span class="range"><input type="range" name="fontSize" min="40" max="90" step="5" value="65"><output></output></span></label>
      <label>全体の縦位置
        <span class="range"><input type="range" name="spacing" min="-25" max="5" step="5" value="-5"><output></output></span></label>
      <label>歌詞の縦位置
        <span class="range"><input type="range" name="spacing2" min="-15" max="30" step="5" value="5"><output></output></span></label>
      <label>ルビの位置
        <span class="range"><input type="range" name="spacing4" min="60" max="115" step="5" value="85"><output></output></span></label>
    </fieldset>
  </form>
</div>

<script>
"use strict";

/* ---------- 定数 ---------- */
const W = 1280;
const H = 720;
const JP_FONT = "HGP明朝E";
const JA_SIZE = 45;                            // 和訳の文字サイズ
const ROW_OFFSET = [12, 8, 4, 0];              // 行ごとの微調整
const RUBY_RE = /(?<=\().*?\|.*?(?=\))/g;      // (漢字|かな) の中身

// "値|表示名" (表示名を省略すると値と同じ)
const FONT_LIST = `

Batang|Batang(韓国)
DXBeautyline|DXBeautyline(韓国)
Sokcho Bada Batang|Sokcho Bada Batang(韓国)
SeoulHangang|SeoulHangang(韓国)
ChosunilboNM|ChosunilboNM(韓国)
Song Myung|Song Myung(韓国)
SANGJU Gotgam|SANGJU Gotgam(韓国)
12LotteMartDreamMedium|12LotteMartDreamMedium(韓国)
HGP明朝E|HGP明朝E(日本)
Noto Sans JP|Noto Sans(日本)
Noto Sans KR|Noto Sans(韓国)
Noto Sans HK|Noto Sans(香港)
Noto Sans TC|Noto Sans(台湾)
Noto Sans SC|Noto Sans(中国)
Noto Sans
BIZ UDPゴシック
`.trim().split("\n");

/* ---------- DOM ---------- */
const form = document.form1;
const canvas = document.getElementById("canvas1");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

// フォント選択肢を生成
(function buildFontOptions() {
  const frag = document.createDocumentFragment();
  for (const line of FONT_LIST) {
    const [value, label = value] = line.split("|");
    const opt = new Option(label, value, false, value === "Times New Roman");
    frag.append(opt);
  }
  form.font.append(frag);
})();

/* ---------- 入力値の読み取り ---------- */
function readOptions() {
  const f = form;
  const lines = (name) => f[name].value.split("\n");
  return {
    bgColor:   f.bgColor.value,
    flg:       f.flg.value.trim(),
    kokki:     f.kokki.value.trim(),
    zoom:      f.zoom.checked,
    title:     f.title.value,
    titleSize: Number(f.titleSize.value),
    titleY:    Number(f.titleY.value),
    titleJa:   f.titleJa.value,
    text:      lines("lyr"),
    text2:     lines("lyr2"),
    ja:        lines("lyrJa"),
    isBold:    f.isBold.value,
    type:      f.type.value,
    font:      f.font.value,
    font2:     f.font2.value,
    italic:    f.italic.value,
    color:     f.color.value,
    alpha:     Number(f.alpha.value),
    LR:        f.LR.value,
    ligature:  f.ligature.value === "true",
    fontSize:  Number(f.fontSize.value),
    spacing:   Number(f.spacing.value),
    spacing2:  Number(f.spacing2.value),
    spacing4:  Number(f.spacing4.value),
  };
}

/* ---------- 画像読み込み(キャッシュ付き) ---------- */
const imageCache = new Map();

function loadImage(src) {
  if (!src) return Promise.resolve(null);
  if (imageCache.has(src)) return imageCache.get(src);

  const tryLoad = (cors) => new Promise((resolve, reject) => {
    const img = new Image();
    if (cors) img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });

  // CORS対応で読めれば PNG保存も可能。ダメなら通常読み込み(表示のみ)
  const p = tryLoad(true)
    .catch(() => tryLoad(false))
    .catch(() => null);
  imageCache.set(src, p);
  return p;
}

/* ---------- テキスト処理 ---------- */
function removeRuby(str, ligature) {
  if (str === undefined) return "";
  let s = str.replace(/\((.*?)\|.*?\)/g, "$1");
  if (ligature) {
    s = s.replace(/ffi/g, "\uFB03")
         .replace(/ffl/g, "\uFB04")
         .replace(/fi/g, "\uFB01")
         .replace(/fl/g, "\uFB02")
         .replace(/ff/g, "\uFB00");
  }
  return s;
}

/* ---------- 描画 ---------- */
function drawBackground(o, img) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = o.bgColor;
  ctx.fillRect(0, 0, W, H);
  ctx.shadowBlur = 0;
  if (!img) return;

  const aspect = img.width / img.height;
  const wide = 16 / 9;
  if ((aspect > wide && !o.zoom) || (aspect < wide && o.zoom)) {
    // 横幅に合わせる
    const h = W / aspect;
    ctx.drawImage(img, 0, (H - h) / 2, W, h);
  } else {
    // 高さに合わせる
    const w = H * aspect;
    ctx.drawImage(img, (W - w) / 2, 0, w, H);
  }
}

// 暗幕(全モード共通)
function drawDim(o) {
  if (!o.alpha) return;
  ctx.save();
  ctx.fillStyle = o.color === "black" ? "white" : "black";
  ctx.globalAlpha = o.alpha;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawTitle(o, flagImg) {
  const shadow = o.color === "black" ? "white" : "black";
  ctx.fillStyle = o.color;
  ctx.shadowColor = shadow;
  ctx.shadowBlur = 20;
  ctx.textAlign = "center";

  ctx.font = `${o.italic} ${o.isBold} ${o.titleSize}px "${o.font}"`;
  ctx.fillText(o.title, 640, o.titleY, 1200);

  ctx.font = `160px "Century", "${JP_FONT}"`;
  ctx.fillText(o.titleJa, 640, 350, 1200);

  if (flagImg) {
    ctx.drawImage(flagImg, 40, 400, 300 * flagImg.width / flagImg.height, 300);
  }
}

function drawMain(o) {
  const shadow = o.color === "black" ? "white" : "black";
  const under = o.LR === "under";
  const left  = o.LR === "left";
  const right = o.LR === "right";
  const maxW  = W - 80;
  const rm = (s) => removeRuby(s, o.ligature);
  const mainFont = `${o.italic} ${o.isBold} ${o.fontSize}px "${o.font}"`;
  const rows = [0, 1, 2, 3];

  ctx.shadowColor = shadow;

  // 影を濃くするため2回重ね描きする
  for (let pass = 0; pass < 2; pass++) {
    ctx.fillStyle = o.color;
    ctx.textAlign = "left";
    ctx.shadowBlur = 10;

    /* 2段目の歌詞 */
    ctx.font = o.font2;
    const t2Shift = [0, 50, 110, 160];
    for (const r of rows) {
      const y = 120 + 180 * r + o.spacing + ROW_OFFSET[r] - (under ? t2Shift[r] : 0);
      ctx.fillText(rm(o.text2[r]), 42.5, y, maxW);
    }

    /* 和訳 */
    ctx.font = `${JA_SIZE}px "Times New Roman", "${JP_FONT}", "Source Han Serif K"`;
    if (under) {
      ctx.textAlign = "right";
      const jaShift = [165, 110, 55, 0];
      for (const r of rows) {
        const y = JA_SIZE + 661 + o.spacing - jaShift[r];
        ctx.fillText(rm(o.ja[r]), W - 40, y, maxW);
      }
      ctx.textAlign = "left";
    } else {
      for (const r of rows) {
        const y = JA_SIZE + 121 + 180 * r + o.spacing + ROW_OFFSET[r];
        ctx.fillText(rm(o.ja[r]), 40, y, maxW);
      }
    }

    /* ルビ */
    for (const r of rows) {
      const line = o.text[r] ?? "";
      ctx.textAlign = "left";
      ctx.font = mainFont;
      const lineWidth = ctx.measureText(rm(line)).width;
      const ratio = lineWidth <= maxW ? 1 : maxW / lineWidth;

      for (const m of line.matchAll(RUBY_RE)) {
        const [base, ruby] = m[0].split("|");

        ctx.textAlign = "left";
        ctx.font = mainFont;
        const width = ctx.measureText(rm(line.substring(0, m.index - 1))).width
                    + ctx.measureText(base).width / 2;

        let writeText = ruby;
        ctx.textAlign = "center";
        ctx.shadowBlur = 2;
        ctx.font = `27px "BIZ UDP明朝"`;
        const bracket = /^【(.*)】$/.exec(writeText);
        if (bracket) {
          writeText = bracket[1];
          ctx.font = `27px "${JP_FONT}"`;
        }

        const baseY = (12 + 176 * r + o.spacing4) - o.fontSize + o.spacing + o.spacing2;
        if (right) {
          // 右から左へ書く言語
          const x = W - 80 - width * ratio;
          ctx.fillText(writeText, x, baseY + 20, maxW);
          ctx.fillText(writeText, x, baseY + 20, maxW);
        } else {
          const x = 40 + width * ratio;
          if (left) {
            ctx.lineWidth = 1;
            ctx.strokeStyle = shadow;
            ctx.strokeText(writeText, x, baseY, maxW);
            ctx.fillText(writeText, x, baseY, maxW);
          } else {
            const y = baseY - 55 * r;
            ctx.fillText(writeText, x, y, maxW);
            ctx.fillText(writeText, x, y, maxW);
          }
        }
      }
    }

    /* メインの歌詞(影ありと影なしで2回) */
    ctx.font = mainFont;
    ctx.shadowColor = shadow;
    ctx.fillStyle = o.color;
    ctx.textAlign = "left";

    const mainShift = [0, 55, 110, 165];
    const rightBase = [80, 260, 440, 620];
    const normalBase = [70, 250, 430, 610];

    for (const blur of [10, 2]) {
      ctx.shadowBlur = blur;
      for (const r of rows) {
        const str = rm(o.text[r]);
        let x, y;
        if (right) {
          x = W - 80 - Math.min(ctx.measureText(str).width, maxW);
          y = rightBase[r] + o.spacing + o.spacing2 + ROW_OFFSET[r];
        } else {
          x = 40;
          y = normalBase[r] + o.spacing + o.spacing2 + ROW_OFFSET[r] - (under ? mainShift[r] : 0);
        }
        ctx.fillText(str, x, y, maxW);
      }
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- 更新(連続入力はまとめて1フレームに) ---------- */
let renderId = 0;
let scheduled = false;

function scheduleUpdate() {
  if (scheduled) return;
  scheduled = true;
  requestAnimationFrame(() => {
    scheduled = false;
    update();
  });
}

async function update() {
  const id = ++renderId;
  const o = readOptions();

  const [bgImg, flagImg] = await Promise.all([
    loadImage(o.flg),
    o.type === "title" ? loadImage(o.kokki) : Promise.resolve(null),
  ]);

  // フォント読み込み待ち(失敗しても描画は続行)
  try { await document.fonts.load(`${o.fontSize}px "${o.font}"`); } catch (_) {}

  // 待っている間に新しい更新が走っていたら破棄
  if (id !== renderId) return;

  statusEl.textContent = (o.flg && !bgImg) ? "背景画像を読み込めませんでした" : "";

  ctx.save();
  drawBackground(o, bgImg);
  drawDim(o);
  if (o.type === "title") drawTitle(o, flagImg);
  else if (o.type === "main4") drawMain(o);
  ctx.restore();
}

/* ---------- スライダーの値表示 ---------- */
function syncOutputs() {
  for (const out of form.querySelectorAll("output")) {
    const input = out.parentElement.querySelector("input[type=range]");
    if (input) out.value = input.value;
  }
}

/* ---------- 状態に応じて項目を出し分け ---------- */
function applyMode() {
  const type = form.type.value;
  for (const el of form.querySelectorAll("[data-modes]")) {
    el.hidden = !el.dataset.modes.split(" ").includes(type);
  }
}

/* ---------- イベント ---------- */
form.addEventListener("input", () => {
  applyMode();
  syncOutputs();
  scheduleUpdate();
});
form.addEventListener("submit", (e) => e.preventDefault());

window.addEventListener("load", () => {
  applyMode();
  syncOutputs();
  update();
});
</script>
