const DAY = 86400000;
const toDay = s => { if (!s) return null; const [y,m,d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m-1, d) / DAY); };
const dayToYMD = n => { const d = new Date(n * DAY); return { y: d.getUTCFullYear(), m: d.getUTCMonth()+1, d: d.getUTCDate() }; };

// データ整形

  p.cab.push(+no);
  terms.push({ no: +no, p, start: toDay(s), end: toDay(e) });
});

  if (b.m < a.m || (b.m === a.m && b.d < a.d)) age--;
  return age;
};
const eraOf = n => {

  const f = (name, sy) => `${name}${y - sy + 1 === 1 ? "元" : y - sy + 1}年`;
  if (k <= 19120729) return f("明治", 1868);
  if (k <= 19261224) return f("大正", 1912);
  if (k <= 19890107) return f("昭和", 1926);
  if (k <= 20190430) return f("平成", 1989);
  return f("令和", 2019);
};

const tiles = people.map(p => {
  const el = document.createElement("div");
  el.className = "t";
  el.innerHTML = `<div class="no">${range(p.cab)}</div><div class="bot"><div class="name">${p.name}</div><div class="st"></div><div class="age"></div><div class="cause"></div></div>`;
  if (IMG[p.name]) {
    const im = new Image();
    im.className = "ph"; im.alt = ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer";
    im.onload = () => el.classList.add("hasimg");
    im.onerror = () => im.remove();
    im.src = IMG_BASE + IMG[p.name];
    el.prepend(im);
  }
  grid.appendChild(el);
  return { p, el, st: el.querySelector(".st"), age: el.querySelector(".age"), cause: el.querySelector(".cause") };
});

// 在任期間ストリップ
const strip = $("strip");
terms.forEach(t => {
  const i = document.createElement("i");
  const l = (t.start - START) / TOTAL * 100, r = (Math.min(t.end, END) - START) / TOTAL * 100;
  i.style.left = l + "%"; i.style.width = Math.max(r - l, 0.15) + "%";
  i.title = `第${t.no}代 ${t.p.name}`;
  strip.insertBefore(i, $("now"));
});
const ticks = $("ticks");
for (let y = 1890; y <= 2020; y += 10) {
  const pos = (toDay(`${y}-01-01`) - START) / TOTAL * 100;
  const s = document.createElement("span"); s.style.left = pos + "%"; s.textContent = y; ticks.appendChild(s);
}

const fmt = n => { const { y, m, d } = dayToYMD(n); return `${y}年${m}月${d}日`; };
let cur = TOTAL;

function render() {
  const day = START + cur;
  $("date").textContent = fmt(day);
  $("era").textContent = eraOf(day);
  $("now").style.left = (cur / TOTAL * 100) + "%";
  const t = terms.find(t => t.start <= day && day < t.end);
  const pmN = $("pmName");
  if (t) {
    pmN.textContent = t.p.name; pmN.classList.remove("none");
    $("pmSub").textContent = `第${t.no}代 ・ 在任${day - t.start + 1}日目 ・ ${ageAt(t.p.birth, day)}歳`;
  } else {
    pmN.textContent = "首相不在（空白期間）"; pmN.classList.add("none");
    $("pmSub").textContent = "";
  }
  let nA = 0, nD = 0, nP = 0, nU = 0;
  tiles.forEach(({ p, el, st, age, cause }) => {
    let cls = "t", stTxt = "", ageTxt = "", cTxt = "";
    if (day < p.birth) { cls += " unborn"; nU++; stTxt = "出生前"; ageTxt = "—"; }
    else if (p.death != null && day >= p.death) {
      cls += " dead"; nD++; ageTxt = ageAt(p.birth, p.death); stTxt = `${dayToYMD(p.death).y}年没`;
      if (CAUSE[p.name]) cTxt = `(${CAUSE[p.name]})`;
    } else {
      cls += " alive"; nA++; ageTxt = ageAt(p.birth, day);
      if (day < p.first) { stTxt = "就任前"; nP++; }
      else if (t && t.p === p) { cls += " office"; stTxt = "在任中"; }
      else stTxt = "元首相";
    }
    el.className = cls + (el.classList.contains('hasimg') ? ' hasimg' : ''); st.textContent = stTxt; age.textContent = ageTxt; cause.textContent = cTxt;
  });
  $("nAlive").textContent = nA; $("nDead").textContent = nD; $("nPre").textContent = nP; $("nUn").textContent = nU;
}

function set(v) { cur = Math.max(0, Math.min(TOTAL, Math.round(v))); slider.value = cur; render(); }
slider.addEventListener("input", () => { cur = +slider.value; render(); });
const shiftYear = k => { const { y, m, d } = dayToYMD(START + cur); set(toDay(`${y + k}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`) - START); };
$("bD-").onclick = () => set(cur - 1); $("bD+").onclick = () => set(cur + 1);
$("bY-").onclick = () => shiftYear(-1); $("bY+").onclick = () => shiftYear(1);
$("today").onclick = () => { stop(); set(TOTAL); };
let timer = null;
function stop() { clearInterval(timer); timer = null; $("play").textContent = "▶ 再生"; $("play").classList.remove("on"); }
$("play").onclick = () => {
  if (timer) return stop();
  if (cur >= TOTAL) set(0);
  $("play").textContent = "■ 停止"; $("play").classList.add("on");
  timer = setInterval(() => { if (cur >= TOTAL) return stop(); set(cur + 14); }, 20);
};
set(TOTAL);
</script>
