<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>世界の国当て</title>
<style>
:root { --bg: #ffffff; --fg: #111111; --muted: #666666; --line: #cccccc; --base: #e2e2e2; --hit: #1f45b5; color-scheme: light; box-sizing: border-box; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 1.25rem; }
.q { margin: 0; font-size: 1.1rem; }
.map { display: block; width: 100%; height: auto; }
.map path { fill: var(--base); stroke: var(--bg); stroke-width: 0.4; stroke-linejoin: round; }
.map path.hit { fill: var(--hit); }
.map circle.dot { display: none; fill: var(--hit); stroke: var(--bg); stroke-width: 0.8; }
.map circle.dot.hit { display: inline; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 640px; }
button { font: inherit; padding: 12px; border: 1px solid var(--fg); border-radius: 0; background: var(--bg); color: var(--fg); cursor: pointer; }
button.yes { background: var(--hit); border-color: var(--hit); color: #fff; }
button:focus-visible { outline: 2px solid var(--hit); outline-offset: 2px; }
.names { margin: 0; font-size: 0.85rem; color: var(--muted); }
.rname { margin: 0; font-size: 1.8rem; font-weight: 700; }
#result p { margin: 0; }
.tools { display: flex; gap: 16px; }
.tools button { border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; }
.tools button:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>世界の国当て</h1>

  <p class="q" id="ask">色の付いた国・地域のどれかが、出身ですか?</p>

  <svg id="map" class="map" role="img" aria-label="世界地図。質問の対象の国・地域に色が付いています。面積の小さい国・地域は点で示します。"></svg>

  <div class="answers" id="answers">
    <button id="no" type="button">いいえ</button>
    <button class="yes" id="yes" type="button">はい</button>
  </div>

  <p class="names" id="names"></p>

  <section id="result" hidden>
    <p class="rname" id="rName"></p>
    <p id="rText"></p>
  </section>

  <div class="tools">
    <button id="undo" type="button">ひとつ戻る</button>
    <button id="reset" type="button">最初から</button>
  </div>
</main>

  $("ask").hidden=done;
  $("answers").hidden=done;
  $("names").hidden=done;
  $("result").hidden=!done;
  $("undo").disabled=path.length===0;
  if(done){
    $("rName").textContent=MAP.names[found]+"ですね";
    $("rText").textContent=path.length+"回で当たりました。";
  }else{
    $("names").textContent=IDS.filter(id=>hit.has(id)).map(id=>MAP.names[id]).join("・");
  }
}

function answer(bit){
  if(lookup(path.join(""))!==null)return;
  path.push(bit);
  render();
}
function undo(){if(path.length){path.pop();render();}}
function reset(){path.length=0;render();}

$("yes").addEventListener("click",()=>answer(1));
$("no").addEventListener("click",()=>answer(0));
$("undo").addEventListener("click",undo);
$("reset").addEventListener("click",reset);
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="1"||e.key==="ArrowRight"){e.preventDefault();answer(1);}
  else if(e.key==="0"||e.key==="ArrowLeft"){e.preventDefault();answer(0);}
  else if(e.key==="Backspace"){e.preventDefault();undo();}
});

render();
</script>
</body>
</html>
