}
function codesOf(root){
  const m={};

  for(const p of prefs){
    const q=p.pop/total;
    avg+=q*codes[p.code].length;
    H-=q*Math.log2(q);
  }
  return {total,avg,H};
}

    for(const p of PREFS){
      const code = DISPLAY_CODES[p.code];
      if(code && code[step] === "1"){
        hit.add(p.code);
      }
    }
  }

  els.forEach((el,code)=>el.setAttribute("class",hit.has(code)?"hit":""));
  $("ask").hidden=done;
  $("answers").hidden=done;
  $("names").hidden=done;
  $("result").hidden=!done;
  $("undo").disabled=path.length===0;
  if(done){
    $("rName").textContent=matchedPref.name+"ですね";
    $("rText").textContent=path.length+"回で当たりました。";
  }else{
    const currentYesPrefs = PREFS.filter(p => {
      const code = DISPLAY_CODES[p.code];
      return code && code[step] === "1";
    });
    $("names").textContent = currentYesPrefs.map(p=>short(p.name)).join("・");
  }
}

function answer(bit){
  const pathStr = path.join("");
  let done = false;
  for(const p of PREFS){
    if(CODES[p.code] === pathStr){ done = true; break; }
  }
  if(done) return;

  path.push(bit);
  render();
}
function undo(){if(path.length){path.pop();render();}}
function reset(){path.length=0;render();}

$("yes").addEventListener("click",()=>answer(1));
$("no").addEventListener("click",()=>answer(0));
$("undo").addEventListener("click",undo);
$("reset").addEventListener("click",reset);
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="1"||e.key==="ArrowRight"){e.preventDefault();answer(1);}
  else if(e.key==="0"||e.key==="ArrowLeft"){e.preventDefault();answer(0);}
  else if(e.key==="Backspace"){e.preventDefault();undo();}
});

render();
</script>

</body></html>
